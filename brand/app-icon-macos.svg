<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS app icon: the mark on Apple's icon grid (824px body, 100px margin for the shadow). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6dff"/>
      <stop offset="1" stop-color="#6e4cf5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(3.21875)">
    <g fill="#ececec">
      <rect x="60" y="60" width="20" height="112" rx="10"/>
      <rect x="118" y="60" width="20" height="136" rx="10"/>
      <rect x="176" y="84" width="20" height="112" rx="10"/>
    </g>
    <circle cx="128" cy="140" r="22" fill="#2dd4bf" stroke="#7c5cff" stroke-width="8"/>
  </g>
</svg>
