name: Feature request
description: Suggest a new feature or a change to how buti works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, rather than the solution. What's awkward or missing today?
      placeholder: When I split a commit I have to leave buti and run `but` by hand, because …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like buti to do?
      description: How it could work (keys, mouse, what shows on screen). A sketch or mockup is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how the GitButler desktop app or `but tui` handle it.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - "No"
        - Yes, I'd like to open a pull request
        - Maybe, with some pointers
